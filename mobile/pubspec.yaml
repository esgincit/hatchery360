name: poultryos
description: PoultryOS — 360° poultry farm management (layer, broiler, hatchery). Offline-first, multi-tenant.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  connectivity_plus: ^6.0.3
  workmanager: ^0.5.2
  camera: ^0.11.0
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  crypto: ^3.0.3
  uuid: ^4.4.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.1
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  sentry_flutter: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
