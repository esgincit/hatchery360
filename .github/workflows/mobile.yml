name: Flutter build
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['mobile/**']
jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: echo "${{ secrets.MOBILE_ENV_DART }}" > lib/env.dart
      - run: flutter pub get
      - run: dart run build_runner build -d
      - run: flutter analyze
      - run: flutter test
      - run: flutter build appbundle --release
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with: { name: app-release.aab, path: mobile/build/app/outputs/bundle/release/app-release.aab }
      # Play upload: add r0adkll/upload-google-play with a service-account JSON secret, track=internal
  build-ios:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: echo "${{ secrets.MOBILE_ENV_DART }}" > lib/env.dart
      - run: flutter pub get && dart run build_runner build -d
      - run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
      # TestFlight upload: xcrun altool / fastlane pilot with APP_STORE_CONNECT_API_KEY secrets
